services:
  alephy:
    build:
      context: .
      dockerfile: Dockerfile
    image: alephy:latest
    container_name: alephy-isolated
    hostname: alephy
    restart: unless-stopped
    # LUKS requires these Linux capabilities inside the container.
    cap_add:
      - SYS_ADMIN
      - MKNOD
    security_opt:
      - apparmor=unconfined
    devices:
      - /dev/loop-control:/dev/loop-control
    networks:
      - alephy-net
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - alephy-luks:/var/lib/alephy
      - .:/workspace/project:ro
    secrets:
      - ssh_authorized_keys
      - luks_passphrase

networks:
  alephy-net:
    name: alephy-isolated-net
    driver: bridge
    internal: true

volumes:
  alephy-luks:
    name: alephy-luks

secrets:
  ssh_authorized_keys:
    file: .alephy-secrets/authorized_keys
  luks_passphrase:
    file: .alephy-secrets/luks_passphrase