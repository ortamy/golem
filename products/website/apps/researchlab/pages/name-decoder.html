<section class="name-decoder-shell" aria-labelledby="name-decoder-title">
  <header class="name-decoder-hero">
    <p class="name-decoder-kicker">ГОЛЕМ · ПАЛЕО-РАЗБОР</p>
    <h1 id="name-decoder-title">Дешифратор Имени</h1>
    <p class="subtitle">Имя — инструкция. Введи имя, чтобы собрать его последовательность букв и увидеть возможное направление действия.</p>
  </header>

  <form id="name-decoder-form" class="name-decoder-form">
    <label for="name-decoder-input">Имя</label>
    <div class="name-decoder-form-row">
      <input id="name-decoder-input" class="lab-input" type="text" maxlength="40" autocomplete="off" placeholder="Например, Давид или Anna" required>
      <button class="lab-btn lab-btn-primary" type="submit">Расшифровать</button>
    </div>
    <p class="name-decoder-hint">Поддерживаются кириллица и латиница. Результат — исследовательская гипотеза, а не установленная этимология.</p>
  </form>

  <div id="name-decoder-result" class="name-decoder-result" aria-live="polite"></div>
</section>
