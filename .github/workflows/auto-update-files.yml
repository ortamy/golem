name: Auto-update files.json

on:
  push:
    paths:
      - 'products/website/src/content/**'
      - 'products/website/src/pages/**'
      - 'tools/generate-files-json.py'
      - 'products/website/files.json'

jobs:
  update:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate files.json
        run: python tools/generate-files-json.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add products/website/files.json
          git diff --staged --quiet || git commit -m "chore: автообновление files.json"
          git push
